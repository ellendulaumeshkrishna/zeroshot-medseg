[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zsmedseg"
version = "1.0.0"
description = "Zero-shot, training-free, text-prompted medical image segmentation (BMC-CLIP + CorrCLIP + MedSAM2)"
authors = [{ name = "Umesh Krishna" }, { name = "Ganesh Bugatha" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "open_clip_torch==2.24.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3",
    "iopath>=0.1.10",
    "opencv-python-headless>=4.8",
    "numpy>=1.23",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "tqdm>=4.64",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
# The demo website (python -m zsmedseg serve)
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
# download-data: Kaggle datasets (BUSI, REFUGE2, CAMUS) and the Google Drive bundle (MedCLIP-SAMv2)
data = ["kaggle>=1.6", "gdown>=5.1"]
# Normalized Surface Dice, reported on UDIAT / lung X-ray / brain MRI / lung CT
eval = ["surface-distance @ git+https://github.com/google-deepmind/surface-distance.git"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
zsmedseg = "zsmedseg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zsmedseg = ["webapp/static/*.*", "webapp/static/examples/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E731"]  # lambdas are used for the prompt-template table

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares upload fields as File(...) / Form(...) defaults
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
